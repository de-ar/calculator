<!DOCTYPE html>
<html>

    <head>
        <link rel="stylesheet" href="assets/css/app.css" />
    </head>

    <body>
        <div id="frame-top-wrap">
            <img id="top-casing" src="./assets/images/frame-top.png" alt="top" />
        </div>
        <div class="inner" id="frame-top-left-wrap">
            <img id="top-left-casing" src="./assets/images/frame-top-left.png" alt="topLeft" />
            <div class="inner" id="screen-frame">
                <div class="inner" id="screen-inputs">
                    <input class="display" id="screen" type="text" />
                    <input class="display" id="result" type="text" />
                </div>
            </div>
            <div id="frame-upper-right">
                <img src="./assets/images/frame-upper-right.png" alt="upperRight" />
            </div>
            <div id="screen-bottom">
                <img src="./assets/images/screen-bottom.png" alt="screenBottom" />
            </div>
            <div id="off-decoration-wrap">
                <img src="./assets/images/off-decoration.png" alt="offbutton" />
            </div>
            <div id="button-clear-wrap">
                <img src="./assets/images/button-clear.png" alt="clearButton" onclick="clearScreen()" value="null" />
            </div>
            <div id="frame-filler-1-wrap">
                <img src="./assets/images/frame-filler-1.png" />
            </div>
            <div id="frame-filler-2-wrap">
                <img src="./assets/images/frame-filler-2.png" />
            </div>
            <div id="frame-filler-3-wrap">
                <img src="./assets/images/frame-filler-3.png" />
            </div>
            <div id="button-7-wrap">
                <img src="./assets/images/button-7.png" alt="number7" onclick="appendDigit(7)" value="7" />
            </div>
            <div id="button-8-wrap">
                <img src="./assets/images/button-8.png" alt="number8" onclick="appendDigit(8)" value="8" />
            </div>
            <div id="button-9-wrap">
                <img src="./assets/images/button-9.png" alt="number9" onclick="appendDigit(9)" value="9" />
            </div>
            <div id="button-divide-wrap">
                <img src="./assets/images/button-divide.png" alt="divide" onclick="pressDivide()" />
            </div>
            <div id="frame-filler-4-wrap">
                <img src="./assets/images/frame-filler-4.png" />
            </div>
            <div id="frame-filler-5-wrap">
                <img src="./assets/images/frame-filler-5.png" />
            </div>
            <div id="button-multiply-wrap">
                <img src="./assets/images/button-multiply.png" alt="multiply" onclick="pressMultiply()" />
            </div>
            <div id="button-6-wrap">
                <img src="./assets/images/button-6.png" alt="number6" onclick="appendDigit(6)" />
            </div>
            <div id="button-5-wrap">
                <img src="./assets/images/button-5.png" alt="number5" onclick="appendDigit(5)" />
            </div>
            <div id="button-4-wrap">
                <img src="./assets/images/button-4.png" alt="number4" onclick="appendDigit(4)" />
            </div>
            <div id="button-1-wrap">
                <img src="./assets/images/button-1.png" alt="number1" onclick="appendDigit(1)" />
            </div>
            <div id="button-2-wrap">
                <img src="./assets/images/button-2.png" alt="number2" onclick="appendDigit(2)" />
            </div>
            <div id="button-3-wrap">
                <img src="./assets/images/button-3.png" alt="number3" onclick="appendDigit(3)" />
            </div>
            <div id="button-subtract-wrap">
                <img src="./assets/images/button-subtract.png" alt="subtract" onclick="pressSubtract()" />
            </div>
            <div id="frame-filler-6-wrap">
                <img src="./assets/images/frame-filler-6.png" />
            </div>
            <div id="frame-filler-7-wrap">
                <img src="./assets/images/frame-filler-7.png" />
            </div>
            <div id="button-add-wrap">
                <img src="./assets/images/button-add.png" alt="addition" onclick="pressAdd()" value="+" />
            </div>
            <div id="button-equals-wrap">
                <img src="./assets/images/button-equals.png" alt="equal" onclick="evaluate()" />
            </div>
            <div id="button-point-wrap">
                <img src="./assets/images/button-point.png" alt="point" onclick="pressPoint()" />
            </div>
            <div id="button-0-wrap">
                <img src="./assets/images/button-0.png" alt="numberzero" onclick="appendDigit(0)" />
            </div>
            <div id="frame-filler-8-wrap">
                <img src="./assets/images/frame-filler-8.png" />
            </div>
            <script src="./assets/js/app.js"></script>
    </body>

</html>
